version: "3.9"

services:

  api:

    build: .

    container_name: agentarmor-api

    ports:

      - "8000:8000"

    volumes:

      - .:/app

    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  dashboard:

    build: .

    container_name: agentarmor-dashboard

    ports:

      - "8501:8501"

    volumes:

      - .:/app

    command: streamlit run dashboard.py --server.address=0.0.0.0